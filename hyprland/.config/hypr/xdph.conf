# xdg-desktop-portal-hyprland configuration.
#
# max_fps caps the screencopy capture rate. The default (0) captures at the
# monitor rate. This monitor runs 3840x2160 at 165 Hz. Each frame is 33 MB, so
# an uncapped capture moves 5.5 GB/s. Discord sends 60 fps at most, thus a cap
# of 60 discards no frame that Discord transmits.
screencopy {
    max_fps = 30
}
